<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <style>
    .callout { font-family: 'Outfit', sans-serif; font-size: 24px; fill: #ffffff; font-weight: 600; letter-spacing: 0.5px; }
    .subtext { font-family: 'Outfit', sans-serif; font-size: 18px; fill: #a5aab5; font-weight: 400; }
    .line { stroke: #cad1df; stroke-width: 2; fill: none; stroke-dasharray: 6 6; }
    .dot { fill: #cad1df; }
    
    .ctrl-body { fill: #16171d; stroke: #3e4453; stroke-width: 3; filter: url(#shadow); }
    .highlighted-ctrl-body {
        fill: #7b8193;
        stroke: rgb(219, 224, 238);
        stroke-width: 3;
        filter: url(#shadow);
    }
    .ctrl-panel { fill: #5f6a86; }
    .ctrl-detail { fill: #0b0c0f; stroke: #2d313b; stroke-width: 2; }
  </style>
  
  <!-- Controller Base (Expanded grips and central body/color zone) -->
  <g transform="translate(150, 140)">
     <!-- Left Trigger / Bumper area suggestion -->
     <path d="M 40 10 C 60 -30 110 -30 130 10 Z" class="highlighted-ctrl-body" fill="#1f2229"/>
     <!-- Right Trigger / Bumper area suggestion -->
     <path d="M 370 10 C 390 -30 440 -30 460 10 Z" class="highlighted-ctrl-body" fill="#1f2229"/>
     
     <!-- Left Grip -->
     <rect x="0" y="0" width="150" height="320" rx="80" ry="80" class="ctrl-body"/>
     <!-- Right Grip -->
     <rect x="350" y="0" width="150" height="320" rx="80" ry="80" class="ctrl-body"/>
     <!-- Center joining shape -->
     <path d="M 80 0 L 420 0 C 440 0 460 24 460 72 L 460 158 C 460 206 440 230 420 230 L 80 230 C 60 230 40 206 40 158 L 40 72 C 40 24 60 0 80 0 Z" class="ctrl-body"/>
     
     <!-- Inner panel overlay -->
     <path d="M 80 0 L 420 0 C 440 0 460 24 460 72 L 460 158 C 460 206 440 230 420 230 L 80 230 C 60 230 40 206 40 158 L 40 72 C 40 24 60 0 80 0 Z" fill="#0c0d10"/>
  </g>

  <!-- Left Stick -->
  <circle cx="260" cy="220" r="40" class="ctrl-detail" />
  <circle cx="260" cy="220" r="28" fill="#ac2f3c" class="highlighted-ctrl-body" />

  <!-- Right Stick -->
  <circle cx="480" cy="300" r="40" class="ctrl-detail" />
  <circle cx="480" cy="300" r="28" fill="#323744" />

  <!-- D-Pad -->
  <g transform="translate(320, 300)">
    <path d="M -12 -35 L 12 -35 L 12 -12 L 35 -12 L 35 12 L 12 12 L 12 35 L -12 35 L -12 12 L -35 12 L -35 -12 L -12 -12 Z" fill="#1f2229" stroke="#3e4453" stroke-width="2" class="highlighted-ctrl-body" />
  </g>

  <!-- Action Buttons -->
  <g transform="translate(540, 220)">
    <!-- Initial colors: stroke="#2ecc71", stroke="#e74c3c", stroke="#3498db", stroke="#f1c40f" -->
    <circle cx="0" cy="0" r="38" fill="#181a20" />
    <circle cx="0" cy="24" r="10" fill="#111" stroke="#30303c" stroke-width="2"/>  <!-- A -->
    <circle cx="24" cy="0" r="10" fill="#111" stroke="#e74c3c" stroke-width="2"/>  <!-- B -->
    <circle cx="-24" cy="0" r="10" fill="#111" stroke="#32303c" stroke-width="2"/> <!-- X -->
    <circle cx="0" cy="-24" r="10" fill="#111" stroke="#30303c" stroke-width="2"/> <!-- Y -->
    
    <!-- Button Letters -->
    <text x="0" y="28" font-size="11" fill="#30303c" font-family="sans-serif" text-anchor="middle" font-weight="bold">A</text>
    <text x="24" y="4" font-size="11" fill="#fff" font-family="sans-serif" text-anchor="middle" font-weight="bold">B</text>
    <text x="-24" y="4" font-size="11" fill="#30303c" font-family="sans-serif" text-anchor="middle" font-weight="bold">X</text>
    <text x="0" y="-20" font-size="11" fill="#30303c" font-family="sans-serif" text-anchor="middle" font-weight="bold">Y</text>
  </g>
  
  <!-- View/Menu/Home -->
  <circle cx="400" cy="180" r="18" fill="#101115" stroke="#333" stroke-width="2"/>
  <rect x="345" y="220" width="18" height="18" rx="4" fill="#323744" />
  <rect x="435" y="220" width="18" height="18" rx="4" fill="#323744" />

  <!-- Left Trigger line and text -->
  <text x="320" y="40" class="callout" text-anchor="middle">LT</text>
  <text x="320" y="70" class="subtext" text-anchor="middle">Previous Mode</text>
  <polyline points="320,80 320,95 235,120" class="line" />
  <circle cx="235" cy="120" r="4" class="dot" />

  <!-- Right Trigger line and text -->
  <text x="480" y="40" class="callout" text-anchor="middle">RT</text>
  <text x="480" y="70" class="subtext" text-anchor="middle">Next Mode</text>
  <polyline points="480,80 480,95 565,120" class="line" />
  <circle cx="565" cy="120" r="4" class="dot" />

  <!-- Left stick line and text -->
  <text x="40" y="70" class="callout">Left Stick</text>
  <text x="40" y="100" class="subtext">Move Pointer &amp; Inject</text>
  <polyline points="90,115 90,150 230,200" class="line" />
  <circle cx="230" cy="200" r="4" class="dot" />

  <!-- D-Pad L/R line and text -->
  <text x="30" y="380" class="callout">Left / Right</text>
  <text x="30" y="410" class="subtext">Choose Parameter</text>
  <polyline points="170,375 200,375 286,300" class="line" />
  <circle cx="286" cy="300" r="4" class="dot" />

  <!-- D-Pad U/D line and text -->
  <text x="30" y="460" class="callout">Up / Down</text>
  <text x="30" y="490" class="subtext">Adjust Parameter</text>
  <polyline points="160,455 230,455 320,336" class="line" />
  <circle cx="320" cy="336" r="4" class="dot" />

  <!-- Button B line and text -->
  <text x="590" y="70" class="callout">Button B</text>
  <text x="590" y="100" class="subtext">Toggle Guide</text>
  <polyline points="630,115 630,150 574,210" class="line" />
  <circle cx="574" cy="210" r="4" class="dot" />

</svg>