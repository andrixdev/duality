<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duality</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Quintessential&family=Tangerine:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section id="controls">
      <div class="control-panel">
        <div class="control">
          <p class="name">-</p>
          <p class="value">0</p>
        </div>
      </div>
      <div class="control-panel">
        <div class="control">
          <p class="name">-</p>
          <p class="value">0</p>
        </div>
      </div>
    </section>

    <div id="mode-name" class="mode-name" aria-live="polite">
      <p class="value">base</p>
    </div>

    <div id="delta-tms" class="delta-tms" aria-live="polite">
      <span class="label">ΔT</span>
      <span class="value">0.0 ms</span>
    </div>

    <!-- Gamepad Instruction Still Image -->
    <div id="guide-overlay">
      <a href="./about/" class="about-link">About physics &amp; art</a>
      <img src="./gamepad_guide.svg" class="gamepad-guide" alt="Gamepad controls guide" />
      <img src="./keyboard_guide.svg" class="gamepad-guide" alt="Keyboard controls guide" />
    </div>

    <script src="./script.js"></script>
  </body>
</html>
